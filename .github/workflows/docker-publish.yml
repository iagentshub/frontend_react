name: Verify and publish frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Respaldo para pushes realizados por automatizaciones que no generan
    # eventos de Actions. El preflight evita reconstruir si latest ya contiene main.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Comprobar si latest ya contiene este commit
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION: ${{ github.sha }}
          IMAGE: ghcr.io/iagentshub/frontend:latest
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image_json=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null || true)
          if printf '%s' "$image_json" | grep -Fq "\"org.opencontainers.image.revision\":\"$EXPECTED_REVISION\""; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/app_flutter
          path: app_flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run public:verify
      - run: npm run seo:csp-hash
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
      - run: npm run seo:verify
      - run: npm run test:e2e:chromium
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app_flutter
      - run: flutter analyze --no-fatal-infos
        working-directory: app_flutter
      - run: flutter test
        working-directory: app_flutter
      - run: flutter build web --release --base-href /app/
        working-directory: app_flutter

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/app_flutter
          path: app_flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # Genera lastmod desde Git antes de que Docker excluya el directorio .git.
      - run: npm run sitemap
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /app/
      - run: cp -r app_flutter/build/web flutter-web
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/iagentshub/frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=react,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # La imagen unificada ghcr.io/iagentshub/app se publica desde el workflow
  # de iagentshub/iAgents, el repositorio que tiene acceso de escritura al paquete.
