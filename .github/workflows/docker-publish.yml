name: Verify and publish frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iagentshub/app_flutter
          path: app_flutter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run public:verify
      - run: npm run seo:csp-hash
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
      - run: npm run seo:verify
      - run: npm run test:e2e:chromium
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app_flutter
      - run: flutter analyze --no-fatal-infos
        working-directory: app_flutter
      - run: flutter test
        working-directory: app_flutter
      - run: flutter build web --release --base-href /app/
        working-directory: app_flutter

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iagentshub/app_flutter
          path: app_flutter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Genera lastmod desde Git antes de que Docker excluya el directorio .git.
      - run: npm run sitemap
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /app/
      - run: cp -r app_flutter/build/web flutter-web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: iagenthub/frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=react,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Imagen unificada (backend + frontend en un solo contenedor) usada por
  # install.sh / docker-compose.hub.yml — publica el tag `:latest` (variante
  # React; ver frontend_vanilla/.github/workflows/docker-publish.yml para `:vanilla`).
  publish-unified:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout iagentshub (Dockerfile + scripts)
        uses: actions/checkout@v4
        with:
          repository: iagentshub/iAgents
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: iagentshub/backend_fastapi
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout Flutter app
        uses: actions/checkout@v4
        with:
          repository: iagentshub/app_flutter
          path: app_flutter

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar sitemap con fechas reales
        working-directory: frontend
        run: npm run sitemap

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /app/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar contexto de build
        run: |
          mkdir -p build-ctx
          cp -r backend/  build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp -r app_flutter/build/web build-ctx/flutter-web
          cp iagentshub/docker/Dockerfile.unified     build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf       build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified.sh  build-ctx/entrypoint-unified.sh

      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Obtener SHAs de backend y frontend
        id: shas
        run: |
          echo "backend=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen multi-plataforma
        uses: docker/build-push-action@v5
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
          tags: |
            iagenthub/app:latest
            iagenthub/app:react-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
