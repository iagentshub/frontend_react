gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/json application/xml application/javascript application/manifest+json image/svg+xml font/woff2;

map $request_uri $seo_robots_header {
    default "";
    ~^/(admin|agents|checkout|connections|dashboard|explore|forgot-password|knowledge|labels|login|manager|memory|orchestrations|profile|register|reset-password|u|verify|vscode-auth|workflows)(/|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name iagentshub.com;
    return 301 https://www.iagentshub.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.iagentshub.com _;
    root /usr/share/nginx/html;
    index index.html;
    # El TLS puede terminar en un proxy anterior. Las redirecciones relativas
    # evitan que nginx reconstruya por error una URL http desde el puerto interno.
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Una sola URL canónica por contenido. Estas redirecciones exactas eliminan
    # duplicados con/sin barra sin afectar a subrutas ni parámetros de consulta.
    location = /en { return 301 /en/$is_args$args; }
    location = /about/ { return 301 /about$is_args$args; }
    location = /en/about/ { return 301 /en/about$is_args$args; }
    location = /pricing { return 301 /pricing/$is_args$args; }
    location = /en/pricing { return 301 /en/pricing/$is_args$args; }
    location = /docs/ { return 301 /docs$is_args$args; }
    location = /en/docs/ { return 301 /en/docs$is_args$args; }
    location = /support/ { return 301 /support$is_args$args; }
    location = /en/support/ { return 301 /en/support$is_args$args; }

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        chunked_transfer_encoding on;
    }

    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ^~ para que la regex de estáticos de abajo no le robe el prefijo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Iconos, favicon y la imagen de Open Graph: sin hash en el nombre, pero
    # tampoco deben revalidarse en cada visita como el HTML.
    location ~* \.(png|svg|ico|webp|jpg|jpeg|gif|woff2)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Ficheros de indexación: cache corta para poder corregirlos sin esperar TTL.
    location = /robots.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Las rutas de aplicación necesitan el shell SPA. Se limitan explícitamente
    # para que una URL pública inventada no termine respondiendo 200.
    location ~ ^/(admin|agents|checkout|connections|dashboard|explore|forgot-password|knowledge|labels|login|manager|memory|orchestrations|profile|register|reset-password|u|verify|vscode-auth|workflows)(/|$) {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $seo_robots_header always;
        try_files $uri /app.html;
    }

    # El HTML público lo genera el prerender en cada build. Solo se sirven rutas
    # existentes; el resto cae en la página 404 con estado HTTP correcto.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        # En un fallback interno a app.html se conserva $request_uri. El map
        # emite noindex solo si la petición original era privada.
        add_header X-Robots-Tag $seo_robots_header always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
