gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/json application/xml application/javascript application/manifest+json image/svg+xml font/woff2;

map $request_uri $seo_robots_header {
    default "";
    ~^/(admin|agents|checkout|connections|dashboard|explore|forgot-password|knowledge|labels|login|manager|memory|orchestrations|profile|register|reset-password|u|verify|vscode-auth|workflows)(/|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name iagentshub.com;
    return 301 https://www.iagentshub.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.iagentshub.com _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        chunked_transfer_encoding on;
    }

    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ^~ para que la regex de estáticos de abajo no le robe el prefijo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Iconos, favicon y la imagen de Open Graph: sin hash en el nombre, pero
    # tampoco deben revalidarse en cada visita como el HTML.
    location ~* \.(png|svg|ico|webp|jpg|jpeg|gif|woff2)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Ficheros de indexación: cache corta para poder corregirlos sin esperar TTL.
    location = /robots.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # El HTML lo genera el prerender en cada build: revalidar siempre para que un
    # despliegue nuevo no quede servido desde caché con metadatos viejos.
    # Las cabeceras de seguridad se repiten aquí porque add_header en un location
    # anula las heredadas del server.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $seo_robots_header always;
        # app.html es el shell sin congelar que deja el prerender; index.html
        # queda como último recurso si la imagen se construyó solo con `build`.
        try_files $uri $uri.html $uri/ /app.html /index.html;
    }
}
