gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
# application/wasm está aquí porque CanvasKit se sirve desde este origen y no
# desde el CDN de Google: canvaskit.wasm son 7,2 MB sin comprimir, y sin esta
# línea la primera carga de /app/ los descarga tal cual.
gzip_types text/plain text/css text/xml application/json application/xml application/javascript application/manifest+json application/wasm image/svg+xml font/woff2;

# ARM64 puede usar un bucket por defecto de 32 bytes, insuficiente para los
# nombres públicos de este virtual host. Fijarlo evita que nginx falle al
# arrancar y permite validar la configuración durante el build multi-arquitectura.
server_names_hash_bucket_size 64;

server {
    listen 80;
    server_name iagentshub.com;
    return 301 https://www.iagentshub.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.iagentshub.com _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location = /en { return 301 /en/$is_args$args; }
    location = /about/ { return 301 /about$is_args$args; }
    location = /en/about/ { return 301 /en/about$is_args$args; }
    location = /pricing { return 301 /pricing/$is_args$args; }
    location = /en/pricing { return 301 /en/pricing/$is_args$args; }
    location = /docs/ { return 301 /docs$is_args$args; }
    location = /en/docs/ { return 301 /en/docs$is_args$args; }
    location = /support/ { return 301 /support$is_args$args; }
    location = /en/support/ { return 301 /en/support$is_args$args; }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        chunked_transfer_encoding on;
    }

    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Flutter Web is the only private application. Its /app/ base href keeps
    # browser refreshes inside Flutter and away from React's public SEO pages.
    location = /app {
        return 308 /app/$is_args$args;
    }

    location ^~ /app/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Esta CSP protege la zona autenticada, así que concede solo lo medido:
        # 'wasm-unsafe-eval' para CanvasKit y fonts.gstatic.com porque el motor
        # descarga Roboto de ahí. Sin 'unsafe-eval': el cargador de partes
        # diferidas de dart2js inyecta <script src>, no eval, mientras el código
        # corra en el hilo principal (comprobado con las partes reales bajo esta
        # misma política). CanvasKit se sirve desde /app/canvaskit/ gracias al
        # --no-web-resources-cdn de app_flutter/tool/build_web.sh, y por eso no
        # aparece www.gstatic.com; cambiar ese flag sin tocar esta línea deja la
        # aplicación en blanco. El hash sha256 es el del JSON-LD de React, que
        # scripts/csp-hash.mjs exige en todas las directivas del fichero.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https://api.stripe.com https://fonts.gstatic.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|svg|ico|webp|jpg|jpeg|gif|woff2)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # /skills was already a legacy alias in the vanilla frontend, which sent it
    # to /knowledge; Flutter has no /skills route because skills live inside
    # Knowledge now. Kept explicitly so old bookmarks survive vanilla's removal
    # instead of turning into 404s.
    location = /skills  { return 301 /app/knowledge; }
    location = /skills/ { return 301 /app/knowledge; }

    # Backwards-compatible redirects for bookmarks from before the Flutter move.
    location ~ ^/(admin|agents|checkout|connections|dashboard|explore|forgot-password|knowledge|labels|login|manager|memory|orchestrations|profile|register|reset-password|u|verify|vscode-auth|workflows)(/|$) {
        return 308 /app$request_uri;
    }

    # React owns exactly the pre-rendered public URLs; invented URLs stay 404.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gNe+76RwsMPIRS0r/VNoYdhxt48oYVnNZZVjxqxBvfE=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
